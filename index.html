<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAJCODE - FINAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0e13;color:#fff;display:flex;justify-content:center;padding:10px;min-height:100vh}
.box{width:100%;max-width:440px;background:#111a22;border-radius:20px;padding:15px;border:1px solid #222}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{color:#ffcc00;font-weight:bold;font-size:22px}
.wal{background:#ffcc00;color:#000;padding:7px 14px;border-radius:20px;font-weight:bold;display:flex;align-items:center;gap:8px}
.wal button{background:#000;color:#ffcc00;border:none;padding:5px 12px;border-radius:15px;font-weight:bold}
.tabs{display:flex;gap:5px;background:#000;padding:5px;border-radius:12px;margin:10px 0}
.tab{flex:1;min-width:55px;padding:9px 5px;text-align:center;background:#1c2731;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer}
.tab.on{background:#ffcc00;color:#000}
.card{background:#1c2731;padding:12px;border-radius:12px;margin:10px 0;border:1px solid #222}
.btn{width:100%;padding:13px;background:#ffcc00;color:#000;border:none;border-radius:10px;font-weight:bold;margin-top:8px;cursor:pointer}
.inp{width:100%;padding:12px;background:#000;border:1px solid #333;color:#fff;border-radius:8px;margin:6px 0}
</style>
</head>
<body>
<div class="box">
<div class="top">
<div class="logo" style="display:flex;align-items:center;gap:8px"><img src="logo.png" style="height:38px;width:38px;border-radius:50%;border:2px solid #ffcc00;object-fit:cover"> <span style="color:#ffcc00;font-weight:bold">RAJCODE</span></div>
<div class="wal">₹<span id="walletBalance">1000</span> <button onclick="openDeposit()">+ ADD</button></div>
</div>
<div class="tabs">
<div class="tab on">🎮 GAME</div>
<div class="tab" onclick="openDeposit()">💰 ADD</div>
<div class="tab">👥 REFER</div>
<div class="tab">💸 OUT</div>
</div>
<div class="card">
<h3 style="color:#ffcc00">🎯 Play & Win</h3>
<p style="color:#aaa;font-size:13px;margin:8px 0">Select karo, jeeto bada!</p>
<button class="btn" onclick="playGame()">PLAY NOW - ₹10</button>
</div>
</div>

<div id="depositModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:10000;justify-content:center;align-items:center;padding:15px">
<div style="background:#1e2a35;padding:20px;border-radius:18px;width:100%;max-width:360px;text-align:center;border:1px solid #ffcc00">
<h2 style="color:#00ff88;margin-bottom:10px">💰 Add Money</h2>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=upi://pay?pa=rajcode@ybl&pn=RajCode&am=100&cu=INR" style="width:210px;margin:10px auto;background:#fff;padding:10px;border-radius:12px;display:block">
<p style="color:#fff;margin:8px 0;font-size:15px">UPI ID: <b style="color:#ffcc00">rajcode@ybl</b></p>
<p style="color:#aaa;font-size:12px;margin-bottom:12px">UPI App se pay karo</p>
<input id="depAmount" type="number" placeholder="Amount (e.g. 100)" style="width:100%;padding:12px;background:#000;border:1px solid #333;color:#fff;border-radius:8px;margin:6px 0">
<input id="depUtr" type="text" placeholder="UTR / Transaction ID (12 digit)" style="width:100%;padding:12px;background:#000;border:1px solid #333;color:#fff;border-radius:8px;margin:6px 0">
<input id="depScreenshot" type="file" accept="image/*" style="width:100%;padding:8px;color:#fff">
<button onclick="submitDeposit()" style="width:100%;padding:13px;background:#00ff88;border:none;border-radius:10px;font-weight:bold;margin-top:10px;color:#000">Submit Request</button>
<button onclick="document.getElementById('depositModal').style.display='none'" style="width:100%;padding:11px;background:#2a3a4a;color:#fff;border:none;border-radius:10px;margin-top:8px">Cancel</button>
</div>
</div>

<script>
let bal=parseInt(localStorage.getItem('wallet')||'1000');
document.getElementById('walletBalance').innerText=bal;
function openDeposit(){document.getElementById('depositModal').style.display='flex';}
function playGame(){if(bal<10){alert('Paisa Add karo');openDeposit();return;}bal-=10;localStorage.setItem('wallet',bal);document.getElementById('walletBalance').innerText=bal;let win=Math.random()>0.5;if(win){bal+=18;localStorage.setItem('wallet',bal);document.getElementById('walletBalance').innerText=bal;alert('🎉 Jeet gaye! ₹18 mila');}else{alert('😢 Haar gaye');}}
function submitDeposit(){const a=document.getElementById('depAmount').value;const u=document.getElementById('depUtr').value;const f=document.getElementById('depScreenshot');if(!a||!u){alert('Amount aur UTR bharo');return;}if(f.files[0]){const r=new FileReader();r.onload=function(e){saveDep(a,u,e.target.result)};r.readAsDataURL(f.files[0]);}else{saveDep(a,u,'');}}
function saveDep(amount,utr,ss){let d=JSON.parse(localStorage.getItem('raj_deposits')||'[]');d.push({amount,utr,screenshot:ss,user:localStorage.getItem('username')||'Guest',time:new Date().toLocaleString(),status:'pending'});localStorage.setItem('raj_deposits',JSON.stringify(d));alert('✅ Request Sent!');document.getElementById('depositModal').style.display='none';}
</script>
</body>
</html>
