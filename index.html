<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rajcode - Toss & Dice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0e13;color:#fff;display:flex;justify-content:center}
.box{width:100%;max-width:430px;background:#12181f;min-height:100vh}
.top{display:flex;justify-content:space-between;padding:15px;background:#1a232e}
.wal{background:#ffcc00;color:#000;padding:6px 14px;border-radius:20px;font-weight:800}
.tabs{display:flex;background:#1a232e;margin:12px;border-radius:12px;padding:4px}
.tab{flex:1;padding:10px;text-align:center;border-radius:9px;font-weight:800;color:#8a9bb0}
.tab.on{background:#ffcc00;color:#000}
.coin{width:120px;height:120px;margin:25px auto;border-radius:50%;background:gold;display:flex;align-items:center;justify-content:center;font-size:60px;color:#000;font-weight:900}
.dice{width:120px;height:120px;margin:25px auto;background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:70px}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px;margin-top:10px}
.c{padding:14px;background:#1c2734;border:2px solid #243041;border-radius:12px;text-align:center;font-weight:800}
.c.on{border-color:#ffcc00;color:#ffcc00;background:#ffcc0015}
.bets{display:flex;gap:7px;padding:10px 14px}
.b{flex:1;background:#1c2734;padding:10px;border-radius:10px;text-align:center;border:1px solid #243041}
.b.on{background:#ffcc00;color:#000;font-weight:800}
.play{margin:12px 14px;width:calc(100% - 28px);background:#ffcc00;border:none;padding:15px;border-radius:14px;font-weight:900;font-size:17px}
.res{text-align:center;font-weight:800;font-size:18px;margin-top:12px;min-height:24px}
.hist{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:10px}
.hist span{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.win{background:#16361e;color:#4ade80} .lose{background:#3a1a1a;color:#ff7a7a}
</style>
</head>
<body>
<div class="box">
<div class="top"><b style="color:#ffcc00">RAJCODE</b><div class="wal">₹ <span id="bal">1000</span></div></div>
<div class="tabs"><div id="t1" class="tab on" onclick="mode='toss';showTab()">TOSS</div><div id="t2" class="tab" onclick="mode='dice';showTab()">DICE</div></div>
<div id="tossArea"><div id="coin" class="coin">₹</div><div class="choice" style="grid-template-columns:1fr 1fr"><div id="h1" class="c on" onclick="side='H';upd()">HEAD</div><div id="h2" class="c" onclick="side='T';upd()">TAIL</div></div></div>
<div id="diceArea" style="display:none"><div id="dice" class="dice">🎲</div><div class="choice"><div class="c on" onclick="num=1;updDice(this)">1</div><div class="c" onclick="num=2;updDice(this)">2</div><div class="c" onclick="num=3;updDice(this)">3</div><div class="c" onclick="num=4;updDice(this)">4</div><div class="c" onclick="num=5;updDice(this)">5</div><div class="c" onclick="num=6;updDice(this)">6</div></div></div>
<div class="bets"><div class="b on" onclick="bet=10;updBet(this)">₹10</div><div class="b" onclick="bet=50;updBet(this)">₹50</div><div class="b" onclick="bet=100;updBet(this)">₹100</div><div class="b" onclick="bet=200;updBet(this)">₹200</div></div>
<button class="play" onclick="play()">PLAY NOW</button>
<div id="res" class="res"></div><div id="hist" class="hist"></div>
</div>
<script>
let bal=1000,mode='toss',side='H',num=1,bet=10,h=[];
function showTab(){document.getElementById('t1').classList.toggle('on',mode=='toss');document.getElementById('t2').classList.toggle('on',mode=='dice');document.getElementById('tossArea').style.display=mode=='toss'?'block':'none';document.getElementById('diceArea').style.display=mode=='dice'?'block':'none';}
function upd(){document.getElementById('h1').classList.toggle('on',side=='H');document.getElementById('h2').classList.toggle('on',side=='T');}
function updDice(e){document.querySelectorAll('#diceArea .c').forEach(x=>x.classList.remove('on'));e.classList.add('on');}
function updBet(e){document.querySelectorAll('.b').forEach(x=>x.classList.remove('on'));e.classList.add('on');}
function play(){
 if(bal<bet){res.innerText='LOW BALANCE';return;}
 res.innerText='ROLLING...';
 setTimeout(()=>{
  if(mode=='toss'){let w=Math.random()>0.5?'H':'T';document.getElementById('coin').innerText=w;if(w==side){bal+=bet;res.innerText='WON +₹'+bet;res.style.color='#4ade80';h.unshift({t:w,ok:true});}else{bal-=bet;res.innerText='LOST -₹'+bet;res.style.color='#ff7a7a';h.unshift({t:w,ok:false});}}
  else{let w=Math.floor(Math.random()*6)+1;document.getElementById('dice').innerText=w;if(w==num){bal+=bet*5;res.innerText='JACKPOT +₹'+(bet*5);res.style.color='#4ade80';h.unshift({t:w,ok:true});}else{bal-=bet;res.innerText='LOST -₹'+bet+' Aya '+w;res.style.color='#ff7a7a';h.unshift({t:w,ok:false});}}
  document.getElementById('bal').innerText=bal;if(h.length>15)h.pop();document.getElementById('hist').innerHTML=h.map(x=>`<span class="${x.ok?'win':'lose'}">${x.t}</span>`).join('');
 },600);
}
let res=document.getElementById('res');
</script>
</body>
</html>
