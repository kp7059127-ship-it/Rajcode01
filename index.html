<!DOCTYPE html>
<html><body style="background:#111;color:white;text-align:center;font-family:Arial;padding:20px">
<h2 style="color:#ffcc00">RAJCODE TOSS</h2>
<h3>Balance: ₹<span id="b">1000</span></h3>
<div id="c" style="width:120px;height:120px;background:gold;border-radius:50%;margin:30px auto;display:flex;align-items:center;justify-content:center;font-size:50px;color:black">₹</div>
<button onclick="ch='H'" style="padding:10px 20px;margin:5px">HEAD</button>
<button onclick="ch='T'" style="padding:10px 20px;margin:5px">TAIL</button>
<br><br>
<button onclick="bet=10" style="padding:8px">10</button>
<button onclick="bet=50" style="padding:8px">50</button>
<button onclick="bet=100" style="padding:8px">100</button>
<br><br>
<button onclick="play()" style="background:gold;padding:15px 40px;border:none;border-radius:10px;font-weight:bold;font-size:18px">TOSS NOW</button>
<h3 id="r" style="margin-top:20px"></h3>
<script>
let bal=1000,ch='H',bet=10;
function play(){
 let win=Math.random()>0.5?'H':'T';
 document.getElementById('c').innerText=win;
 if(win==ch){bal+=bet;document.getElementById('r').innerText='WON ₹'+bet;document.getElementById('r').style.color='lightgreen';}
 else{bal-=bet;document.getElementById('r').innerText='LOST ₹'+bet;document.getElementById('r').style.color='red';}
 document.getElementById('b').innerText=bal;
}
</script>
</body></html>
